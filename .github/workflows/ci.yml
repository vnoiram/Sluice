# CI(実装ガイド §9.2 の SignPath Foundation 申請前提「CI(GitHub Actions等)
# でのビルド」を満たすために追加)。
#
# ASIO SDK は不要(engine/・vasio/ とも asio-abi/ の独自 ABI 実装でビルドする、
# asio-abi/README.md 参照)なので、sluice-engine.exe 本体・vasio.dll 本体を
# CI で実際にビルドできる(以前は Steinberg の SDK をこの CI に置けないため
# フォールバック経路=コアテストのみしか検証できなかった)。DAW からの実際の
# ロード確認・実 ASIO デバイスとの通信確認は実機が要るため、CI の範囲外
# (engine/README.md・vasio/README.md の「検証状況」節を参照)。
#
# 各ジョブは Windows Docker 経由のローカル開発スクリプト
# (scripts/build-*-in-windows-docker.ps1)が最終的に呼ぶのと同じ
# engine/scripts/run-tests.ps1・vasio/scripts/run-build.ps1・
# ui/scripts/run-tests.ps1 を、windows-2022 ランナー上で直接(Docker層を
# 挟まずに)呼び出す。ランナーは Windows Server ベースで Visual Studio 2022
# Build Tools・vcpkg(VCPKG_INSTALLATION_ROOT)が既定でプリインストールされて
# いる前提(GitHub がドキュメント化している windows-2022 イメージの仕様)。
# セキュリティ監査(docs/security-audit-2026-08-12.md)の指摘に基づき、
# windows-latest(可変)ではなく特定バージョンのランナーイメージに固定し、
# actions/checkout・actions/setup-dotnet もタグではなくコミット SHA に
# 固定している(サプライチェーン改ざん対策)。
#
# 注意: このワークフローは Windows GitHub-hosted ランナー上での実行で
# 検証されていない(この開発環境が WSL/Linux のため)。初回実行時に
# ランナーイメージの差異(VS のバージョン、vcpkg の既定 triplet 等)で
# 調整が必要になる可能性がある。

name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: engine core tests + tools/latencybench + tools/devprobe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install libsamplerate (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libsamplerate:x64-windows-static-md

      - name: Configure, build, test
        shell: pwsh
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          .\engine\scripts\run-tests.ps1

  vasio:
    name: vasio shared-memory protocol
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Configure, build, test
        shell: pwsh
        run: |
          .\vasio\scripts\run-build.ps1

  ui:
    name: SluiceUi (.NET)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - name: Build and test
        shell: pwsh
        run: |
          .\ui\scripts\run-tests.ps1
